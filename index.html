<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BIX 출석 스캔</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" integrity="sha384-hStSInNIZ8ljtOVrmrgf7zdHMapaLBWoSnPTtF0nzsybp4+LuhDz6sHuEVpWIX8o" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 키비주얼 (사이드월 현수막): 검정 배경 · 라임 #B3D000 · 흰 글씨 · 무지개 리본 */
:root{--bg:#000;--lime:#B3D000;--lime-d:#8FA600;--ink:#fff;--muted:#a8a8a8;--panel:#0f0f10;--line:#2b2b2e;
--rib:linear-gradient(90deg,#B3D000 0%,#4FB39A 35%,#5871AB 68%,#7A4AB0 100%);
--ok:#B3D000;--dup:#FFD43B;--bad:#F04438;--wait:#3B82F6}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;min-height:100vh}
.ribbon{position:fixed;right:0;bottom:0;width:min(560px,62vw);height:min(640px,72vh);background:url(assets/ribbon.webp) right bottom/contain no-repeat;opacity:.5;pointer-events:none;z-index:0}
#main{position:relative;z-index:1}
.badge{display:inline-block;background:var(--lime);color:#000;font-weight:900;border-radius:6px 6px 6px 0;padding:2px 9px;letter-spacing:-.3px}
.lime{color:var(--lime)}
/* ---- 운영자 스캔 ---- */
.top{background:#000;border-bottom:3px solid transparent;border-image:var(--rib) 1;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top b{font-size:18px;font-weight:900;letter-spacing:-.5px}.sp{flex:1}
.cnt{background:#141414;border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-weight:900;font-size:18px;color:var(--lime)}.cnt small{font-size:12px;color:var(--muted);font-weight:500}
.wrap{display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,1fr);gap:16px;padding:14px;max-width:1100px;margin:0 auto}
.guide{background:#0d0d0d;border:1px solid var(--lime);color:var(--lime);border-radius:12px;padding:10px 14px;font-weight:800;margin:0 0 10px;font-size:16px}
.cam{position:relative;background:#111;border-radius:16px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:14% 20%;border:4px solid var(--lime);border-radius:16px;box-shadow:0 0 0 999px #000a}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;text-align:center;padding:20px;font-weight:600}
.tip{color:#000;background:var(--lime);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--lime);color:#000;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.btn.sec{background:transparent;color:#fff;border:1px solid #555}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
h3{color:#fff}.rec div{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}.note{color:var(--muted);font-size:13px}
.lock{max-width:440px;margin:70px auto;text-align:center;padding:0 16px}.lock h2{font-weight:900}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
/* ---- 셀프 체크인(키오스크) ---- */
body.kiosk{overflow:hidden;height:100vh}
body.kiosk #main{position:static;z-index:auto}
.k-cam{position:fixed;inset:0;background:#000;z-index:0}.k-cam video{width:100%;height:100%;object-fit:cover}.k-cam video.mirror{transform:scaleX(-1)}
body.kiosk .ribbon{z-index:2;opacity:.55;width:min(40vw,40vh);height:min(46vw,46vh)}
.k-guide{position:fixed;left:50%;top:60%;width:min(54vw,44vh);height:min(54vw,44vh);transform:translate(-50%,-50%);border:7px solid var(--lime);border-radius:30px;box-shadow:0 0 0 9999px #000d;z-index:1}
.k-head{position:fixed;left:0;right:0;top:2.2vh;text-align:center;z-index:5;font-weight:900;letter-spacing:-1px;font-size:min(4.6vw,34px)}
.k-head .badge{font-size:.8em;margin-right:8px;vertical-align:.08em}
.k-steps{position:fixed;left:0;right:0;top:calc(2.2vh + min(4.6vw,34px) + 2.2vh);display:flex;justify-content:center;gap:min(2.4vw,20px);padding:0 3vw;z-index:5;flex-wrap:wrap}
.k-step{background:#111;border:1px solid #333;color:#fff;border-radius:16px;padding:min(1.4vw,10px) min(2.2vw,16px);display:flex;align-items:center;gap:8px;font-size:min(2.6vw,20px);font-weight:800}
.k-step i{font-style:normal;font-size:min(4.4vw,34px)}.k-step b{display:inline-block;background:var(--lime);color:#000;border-radius:50%;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;font-size:.8em;font-weight:900}
.k-title{position:fixed;left:0;right:0;bottom:calc(40% + min(27vw,22vh) + 1.8vh);text-align:center;color:#fff;font-size:min(5vw,36px);font-weight:900;letter-spacing:-1px;z-index:5;text-shadow:0 2px 12px #000}
.k-tip{position:fixed;left:0;right:0;bottom:max(4vh, calc(40% - min(27vw,22vh) - 8vh));text-align:center;z-index:5}.k-tip span{background:var(--lime);color:#000;border-radius:999px;padding:10px 22px;font-size:min(3.4vw,24px);font-weight:900}
.k-cnt{position:fixed;right:14px;bottom:10px;color:#777;font-size:13px;z-index:5}
.k-start{position:fixed;inset:0;z-index:30;background:#000 url(assets/ribbon.webp) right bottom/min(60vw,60vh) no-repeat;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:min(7vw,52px);font-weight:900;flex-direction:column;gap:16px}
.k-start.on{display:flex}.k-start small{font-size:min(3.4vw,20px);font-weight:500;color:var(--muted)}.k-start .badge{font-size:min(4vw,26px)}
.k-corner{position:fixed;left:0;top:0;width:90px;height:90px;z-index:25}
.k-menu{position:fixed;inset:0;z-index:40;background:#000d;display:none;align-items:center;justify-content:center;padding:16px}.k-menu.on{display:flex}
.k-box{background:#111;color:#fff;border:1px solid #333;border-radius:18px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.k-over{display:none}
/* ---- 결과 팝업 (검정 배경에서 또렷하게) ---- */
.pop{position:fixed;inset:0;z-index:50;background:#000c;display:none;align-items:center;justify-content:center;padding:5vw}.pop.on{display:flex}
.pop .card{width:min(680px,100%);border-radius:28px;padding:min(6vw,44px) min(5vw,36px);text-align:center;box-shadow:0 0 0 4px #000,0 24px 70px #000;animation:popin .16s ease-out}
@keyframes popin{from{transform:scale(.88);opacity:.2}to{transform:none;opacity:1}}
.pop .ic{width:min(22vw,130px);height:min(22vw,130px);border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:min(14vw,84px);font-weight:900;background:#000}
.pop .m{font-size:min(6vw,38px);font-weight:900;letter-spacing:-1px;line-height:1.3}.pop .s{font-size:min(4vw,22px);margin-top:10px;font-weight:700}.pop .x{font-size:13px;margin-top:14px;opacity:.7}
.pop.ok .card{background:var(--ok);color:#000}.pop.ok .ic{color:var(--ok)}
.pop.dup .card{background:var(--dup);color:#000}.pop.dup .ic{color:var(--dup)}
.pop.bad .card{background:var(--bad);color:#fff}.pop.bad .ic{color:var(--bad);background:#fff}
.pop.wait .card{background:var(--wait);color:#fff}.pop.wait .ic{color:var(--wait);background:#fff}
</style></head><body>
<div class="ribbon" aria-hidden="true"></div><div id="main"></div>
<script>
'use strict';
/* 코드만 있는 페이지 — 명단·연락처 없음. 세션·API 주소·모드는 운영자 화면에서 받은 링크의 # 뒤에서만 읽고 바로 지움 */
const API_RE=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
let S='',API='',MODE='';
(function(){
  const h=new URLSearchParams(location.hash.slice(1)), ss=(k,v)=>{try{v===undefined?0:sessionStorage.setItem(k,v);return sessionStorage.getItem(k)||''}catch(e){return v||''}};
  if(h.get('s')&&h.get('api')){ S=ss('bix_s',h.get('s')); API=ss('bix_api',h.get('api')); MODE=ss('bix_mode',h.get('mode')==='kiosk'?'kiosk':'staff') }
  else { S=ss('bix_s'); API=ss('bix_api'); MODE=ss('bix_mode') }
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
})();
const KIOSK=MODE==='kiosk';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEV=(KIOSK?'K':'')+(()=>{try{let d=localStorage.getItem('bix_scan_dev');if(!d){d=Math.random().toString(36).slice(2,10).toUpperCase();localStorage.setItem('bix_scan_dev',d)}return d}catch(e){return 'X'}})();

/* ---------- 공통: API·토큰·소리 ---------- */
function tokenOf(text){ text=String(text||'').trim(); if(!text.startsWith(API+'?p=')) return ''; const t=text.slice(API.length+3).split(/[&#]/)[0]; return /^[A-Za-z2-7]{16,40}$/.test(t)?t.toUpperCase():'' }
async function api(body){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({s:S},body)),redirect:'follow'}); return r.json() }
let audio=null;
function tone(k){ try{navigator.vibrate&&navigator.vibrate(k==='ok'?150:[90,70,90])}catch(e){}
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const g0=KIOSK?.35:.12;
    (k==='ok'?[1047,1568]:k==='dup'?[880,880]:[330,247]).forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=k==='ok'?'sine':'square';o.frequency.value=hz;g.gain.value=k==='ok'?g0:g0*.5;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+i*.16);o.stop(audio.currentTime+i*.16+.14)}) }catch(e){} }
const REC=[];
function recAdd(cls,txt){ REC.unshift({t:new Date().toTimeString().slice(0,8),c:cls,x:txt}); REC.length=Math.min(REC.length,10); const el=$('rec'); if(el) el.innerHTML=recHTML() }
function recHTML(){ return REC.map(r=>'<div><span>'+r.t+'</span><b style="color:'+(r.c==='ok'?'#0b6b2a':r.c==='dup'?'#8a5a00':'#e03131')+'">'+esc(r.x)+'</b></div>').join('')||'<span class="note">없음</span>' }
let COUNT='–';
async function stat(){ try{ const r=await api({action:'stat'}); if(r.r==='ok'){ COUNT=r.checked+' / '+r.total; const el=$('cnt'); if(el) el.innerHTML=KIOSK?'출석 '+esc(COUNT):r.checked+' <small>/ '+r.total+' 출석 · '+esc(r.now)+'</small>' } else if(r.r==='nosession'){ SESS_ERR=true; const el=$('cnt'); if(el) el.innerHTML=KIOSK?'세션 끊김':'세션 끊김 — 운영자에게' } }catch(e){} }

/** QR 글자 → 서버 기록 → {cls, r} */
let LAST={t:'',at:0},BUSY=false,SESS_ERR=false;
const REPEAT_MS=KIOSK?8000:3000;   // 같은 QR 다시 읽지 않는 시간 (셀프 모드는 결과 화면 동안 들고 있어도 중복 안 뜨게 길게)
/* 서버가 바쁘거나(잠금 대기 초과 busy·분당 한도 rate) 통신이 끊기면 → 「안내데스크」가 아니라 「잠시 후 다시」 + 같은 QR 자동 재시도 1회 */
const RETRYABLE=r=>r==='busy'||r==='rate'||r==='net';
async function handle(text,retry){
  const now=Date.now();
  if(!retry){ if(text===LAST.t&&now-LAST.at<REPEAT_MS) return; if(BUSY||PAUSE) return; }
  LAST={t:text,at:now};
  const tok=tokenOf(text); if(!tok) return show({r:'invalid',local:true});
  BUSY=true; let r;
  try{ r=await api({action:'scan',tok:API+'?p='+tok,dev:DEV}) }catch(e){ r={r:'net'} }
  BUSY=false;
  if(RETRYABLE(r.r)){
    if(!retry){ show({r:'wait'}); setTimeout(()=>{ closePop(); handle(text,true) },1500); return }   // 1.5초 뒤 자동 재시도 1회
    LAST={t:'',at:0}; return show({r:'again'});                                                  // 재시도도 실패 → 다시 비춰 달라고만 (중복 무시에 안 막히게 초기화)
  }
  if(r.r==='nosession') SESS_ERR=true;
  show(r); if(r.r==='ok') stat();
}

/* ---------- 결과 팝업 (공통 문구) ---------- */
const TIPS=['휴대폰 화면 밝기를 최대로','빛 반사 없이 QR을 화면 가운데 상자에 맞춰 주세요','10~20cm 거리에서 잠시 멈춰 주세요'];
let TIPI=0;setInterval(()=>{TIPI=(TIPI+1)%TIPS.length;const el=$('tip');if(el)el.textContent=TIPS[TIPI]},3500);
let POPT=0;
function popup(r){
  const ok=r.r==='ok',dup=r.r==='dup',wait=r.r==='wait'||r.r==='again',cls=ok?'ok':dup?'dup':wait?'wait':'bad';
  const m=ok?esc(r.team)+'번 팀, '+esc(r.label)+'님 출석체크 되었습니다.':dup?esc(r.label)+'님은 이미 출석체크 하였습니다.':
    r.r==='wait'?'잠시 후 다시 비춰 주세요':r.r==='again'?'다시 비춰 주세요':'확인되지 않았습니다. 안내데스크로 문의해 주세요.';
  const sub=ok?(KIOSK?'명찰을 받아 가세요':''):dup?'체크 시각 '+esc(r.t):r.r==='wait'?'확인 중이에요':'';
  const ms=wait?(r.r==='wait'?1500:2000):KIOSK?(ok?2500:dup?3000:4000):2000;
  let el=$('pop'); if(!el){ el=document.createElement('div'); el.id='pop'; document.body.appendChild(el) }
  el.className='pop on '+cls; el.innerHTML='<div class="card"><div class="ic">'+(ok?'✓':dup?'!':wait?'↻':'✕')+'</div><div class="m">'+m+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+(KIOSK?'':'<div class="x">탭하면 닫힘</div>')+'</div>';
  el.onclick=KIOSK?null:closePop;
  if(!wait) tone(cls==='ok'?'ok':cls==='dup'?'dup':'bad');
  if(r.r==='wait') return (PAUSE=true);
  recAdd(cls,ok?(r.team+'번 '+r.label+' ✓'):dup?(r.label+' 이미 체크'):(r.r==='again'?'재시도 안내(바쁨)':'실패 · '+(r.r||'')));
  PAUSE=true; clearTimeout(POPT); POPT=setTimeout(closePop,ms);
}
function closePop(){ clearTimeout(POPT); const el=$('pop'); if(el) el.className='pop'; PAUSE=false }

/* ---------- 카메라 (공통) ---------- */
let CAM={st:null,raf:0},FACING=KIOSK?'user':'environment',PAUSE=false;
function stopCam(){ if(CAM.raf)cancelAnimationFrame(CAM.raf); CAM.raf=0; if(CAM.st){CAM.st.getTracks().forEach(t=>t.stop());CAM.st=null} }
async function startCam(){
  if(typeof jsQR!=='function'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('nocam'),{name:'NoCamera'});
  stopCam();
  CAM.st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:FACING},width:{ideal:1280},height:{ideal:720}},audio:false});
  CAM.st.getVideoTracks().forEach(t=>t.addEventListener('ended',()=>{ if(KIOSK) setTimeout(kioskStart,800) }));
  const v=$('v'); v.srcObject=CAM.st; v.setAttribute('playsinline',''); v.muted=true; await v.play();
  if(KIOSK) v.classList.toggle('mirror',FACING==='user');
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  const loop=()=>{ if(!CAM.st) return; if(!PAUSE&&v.readyState>=2&&v.videoWidth){ const w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth); c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
    const q=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'}); if(q&&q.data) handle(q.data) } CAM.raf=requestAnimationFrame(loop) }; loop();
}
async function photo(inp){ const f=inp.files&&inp.files[0]; if(!f||typeof jsQR!=='function') return; const url=URL.createObjectURL(f);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url}).catch(()=>null); URL.revokeObjectURL(url); inp.value='';
  if(!img) return show({r:'invalid',local:true});
  for(const mx of [1600,1000,700]){ const sc=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    const q=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'}); if(q&&q.data){ LAST={t:'',at:0}; return handle(q.data) } }
  show({r:'invalid',local:true}) }

function lock(msg){ stopCam(); document.body.className=''; $('main').innerHTML='<div class="lock"><p><span class="badge">BIX 2026</span></p><h2>스캔 페이지를 열 수 없어요</h2><p class="note">'+msg+'</p><p class="note">운영자 화면 › QR 스캔 › 「📷 카메라 스캔 열기」 또는 「📷 셀프 체크인 열기」로 다시 열어 주세요.</p></div>' }

/* ---------- 운영자 모드 화면 ---------- */
function staffUI(){
  $('main').innerHTML=`<div class="top"><span class="badge">BIX 2026</span><b>킥오프 출석 스캔</b><span class="sp"></span><span class="cnt" id="cnt">– <small>출석</small></span></div>
 <div class="wrap"><div><div class="guide">참가자 휴대폰 QR을 상자에 맞춰 찍어 주세요</div><div class="cam"><video id="v" playsinline muted></video><div class="frame"></div><div class="tip" id="tip">${TIPS[0]}</div><div class="ph" id="ph">「카메라 켜기」를 누르고<br>참가자 휴대폰의 개인 QR을 상자에 맞춰 주세요</div></div>
 <div class="row"><button class="btn" id="cb" onclick="staffToggle()">카메라 켜기</button><label class="btn sec">사진으로 스캔<input type="file" accept="image/*" capture="environment" style="display:none" onchange="photo(this)"></label></div>
 <p class="note" id="note">연속 스캔 · 같은 QR은 3초 안에 다시 읽지 않음</p></div>
 <div><h3 style="margin:0 0 6px;font-size:15px">최근 10건</h3><div class="rec" id="rec">${recHTML()}</div></div></div>`;
}
async function staffToggle(){ if(CAM.st){ stopCam(); $('cb').textContent='카메라 켜기'; $('ph').style.display=''; return }
  try{ await startCam(); $('ph').style.display='none'; $('cb').textContent='카메라 끄기' }catch(e){ $('note').textContent='카메라를 열 수 없어요('+(e&&e.name||'')+') → 브라우저 카메라 권한 허용 또는 「사진으로 스캔」' } }
function staffShow(r){ return popup(r) }

/* ---------- 셀프 체크인(키오스크) 화면 ---------- */
function kioskUI(){
  document.body.className='kiosk';
  $('main').innerHTML=`<div class="k-cam"><video id="v" playsinline muted autoplay></video></div><div class="k-guide"></div>
 <div class="k-head"><span class="badge">BIX 2026</span>부산 <span class="lime">지산학</span> 혁신대전 킥오프</div>

let STARTING=false;
async function kioskStart(fromTap){
  if(STARTING) return; STARTING=true;
  try{ if(fromTap){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume() }catch(e){} }
    await startCam(); $('start').classList.remove('on'); if(fromTap) wake() }
  catch(e){ $('start').classList.add('on'); $('start').innerHTML='<span class="badge">BIX 2026 · 셀프 체크인</span>'+(e&&e.name==='NotAllowedError'?'카메라 허용이 필요해요':'눌러서 시작')+'<small>'+(e&&e.name==='NotAllowedError'?'사파리 설정 › 카메라 › 허용 후 눌러 주세요':'카메라를 켜고 셀프 체크인을 시작합니다')+'</small>' }
  finally{ STARTING=false } }
function kioskWatch(){ const v=$('v'); if(!v||$('start').classList.contains('on')) return;
  const live=CAM.st&&CAM.st.getVideoTracks().some(t=>t.readyState==='live');
  if(!live||v.paused) kioskStart(false) }          // 카메라가 멈추면 자동 재시작
async function flipCam(){ FACING=FACING==='user'?'environment':'user'; await kioskStart(true); $('mInfo').textContent=info() }
let WL=null,WL_OK=null;
async function wake(){ try{ if('wakeLock' in navigator){ WL=await navigator.wakeLock.request('screen'); WL_OK=true } else WL_OK=false }catch(e){ WL_OK=false } }
document.addEventListener('visibilitychange',()=>{ if(KIOSK&&document.visibilityState==='visible'){ wake(); kioskWatch() } });
