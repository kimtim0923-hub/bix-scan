<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>BIX 출석 스캔</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" integrity="sha384-hStSInNIZ8ljtOVrmrgf7zdHMapaLBWoSnPTtF0nzsybp4+LuhDz6sHuEVpWIX8o" crossorigin="anonymous"></script>
<style>
:root{--navy:#0a1530;--mint:#d9f3e1;--yellow:#fef7d6;--red:#fde8e8;--surface:#f6f5f4;--primary:#5645d4}
*{box-sizing:border-box}body{margin:0;font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;background:#fff;color:#1a1a1a}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top b{font-size:17px}.sp{flex:1}
.cnt{background:#1a2a52;border-radius:10px;padding:4px 12px;font-weight:700;font-size:18px}.cnt small{font-size:12px;color:#a4a097;font-weight:400}
.wrap{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:14px;padding:14px;max-width:1100px;margin:0 auto}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:14% 20%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px #0005}.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;text-align:center;padding:20px}
.btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}.btn.sec{background:#fff;color:#1a1a1a;border:1px solid #c8c4be}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.res{border-radius:18px;padding:22px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
.res .big{font-size:36px;font-weight:800;letter-spacing:-.8px}.res .sub{font-size:18px;margin-top:6px}
.res.ok{background:var(--mint);color:#0b6b2a}.res.dup{background:var(--yellow);color:#8a5a00}.res.bad{background:var(--red);color:#e03131}
.rec div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid #eee;font-size:14px}.note{color:#787671;font-size:13px}
.lock{max-width:420px;margin:60px auto;text-align:center;padding:0 16px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><b>BIX 킥오프 출석 스캔</b><span class="sp"></span><span class="cnt" id="cnt">– <small>출석</small></span></div>
<div id="main"></div>
<script>
'use strict';
/* 코드만 있는 페이지 — 명단·연락처 없음. 세션·API 주소는 운영자 화면에서 받은 링크의 # 뒤에서만 읽고 바로 지움 */
const API_RE=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
let S='',API='';
(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('s')&&h.get('api')){ try{ sessionStorage.setItem('bix_s',h.get('s')); sessionStorage.setItem('bix_api',h.get('api')) }catch(e){} S=h.get('s'); API=h.get('api') }
  else { try{ S=sessionStorage.getItem('bix_s')||''; API=sessionStorage.getItem('bix_api')||'' }catch(e){} }
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEV=(()=>{try{let d=localStorage.getItem('bix_scan_dev');if(!d){d=Math.random().toString(36).slice(2,10).toUpperCase();localStorage.setItem('bix_scan_dev',d)}return d}catch(e){return 'X'}})();
function lock(msg){ $('main').innerHTML='<div class="lock"><h2>스캔 페이지를 열 수 없어요</h2><p class="note">'+msg+'</p><p class="note">운영자 화면 › QR 스캔 › 「📷 카메라 스캔 열기」로 다시 열어 주세요.</p></div>'; stopCam() }
if(!S||!API_RE.test(API)) lock('세션 정보가 없습니다.');
else $('main').innerHTML=`<div class="wrap"><div><div class="cam"><video id="v" playsinline muted></video><div class="frame"></div><div class="ph" id="ph">「카메라 켜기」를 누르고<br>참가자 휴대폰의 개인 QR을 네모 안에 비춰 주세요</div></div>
 <div class="row"><button class="btn" id="cb" onclick="toggleCam()">카메라 켜기</button><label class="btn sec">사진으로 스캔<input type="file" accept="image/*" capture="environment" style="display:none" onchange="photo(this)"></label></div>
 <p class="note" id="note">연속 스캔 · 같은 QR은 3초 안에 다시 읽지 않음</p></div>
 <div><div class="res" id="res"><div class="big">대기 중</div><div class="sub">QR을 비춰 주세요</div></div><h3 style="margin:14px 0 6px;font-size:15px">최근 10건</h3><div class="rec" id="rec"><span class="note">없음</span></div></div></div>`;

/** 우리 참가자용 주소 형식(API?p=토큰)만 허용 → 토큰만 뽑음 */
function tokenOf(text){ text=String(text||'').trim(); if(!text.startsWith(API+'?p=')) return ''; const t=text.slice(API.length+3).split(/[&#]/)[0]; return /^[A-Za-z2-7]{16,40}$/.test(t)?t.toUpperCase():'' }
async function api(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({s:S},body)),redirect:'follow'});
  return r.json();
}
let audio=null;function tone(k){ try{navigator.vibrate&&navigator.vibrate(k==='ok'?120:[80,60,80])}catch(e){}
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); (k==='ok'?[1320]:k==='dup'?[880,880]:[300]).forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=hz;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+i*.18);o.stop(audio.currentTime+i*.18+.13)}) }catch(e){} }
const REC=[];
function show(cls,big,sub){ const el=$('res'); el.className='res '+cls; el.innerHTML='<div class="big">'+big+'</div><div class="sub">'+sub+'</div>'; tone(cls==='ok'?'ok':cls==='dup'?'dup':'bad');
  REC.unshift({t:new Date().toTimeString().slice(0,8),c:cls,x:big}); REC.length=Math.min(REC.length,10);
  $('rec').innerHTML=REC.map(r=>'<div><span>'+r.t+'</span><b style="color:'+(r.c==='ok'?'#0b6b2a':r.c==='dup'?'#8a5a00':'#e03131')+'">'+r.x+'</b></div>').join('') }
let LAST={t:'',at:0},BUSY=false;
async function handle(text){
  const now=Date.now(); if(text===LAST.t&&now-LAST.at<3000) return; LAST={t:text,at:now};
  const tok=tokenOf(text); if(!tok){ show('bad','✕ 없는 QR','행사 개인 QR이 아닙니다'); return }
  if(BUSY) return; BUSY=true;
  try{ const r=await api({action:'scan',tok:API+'?p='+tok,dev:DEV}); BUSY=false;
    const who=esc(r.team)+'팀 '+esc(r.label), kind=r.type==='기업'?'참여기업':esc(r.school||'')+' 학생';
    if(r.r==='ok') show('ok','✓ '+who,kind+' · '+esc(r.t)+' 출석');
    else if(r.r==='dup') show('dup','⚠ 이미 체크 '+esc(r.t),who+' ('+esc(r.m)+')');
    else if(r.r==='revoked') show('bad','✕ 재발급 전 QR','새로 받은 문자의 QR을 보여 달라고 안내');
    else if(r.r==='invalid') show('bad','✕ 없는 QR','명단에 없는 QR — 수동 검색');
    else if(r.r==='nosession') lock('세션이 끝났거나 끊겼습니다.');
    else if(r.r==='rate'||r.r==='busy') show('dup','잠시 후 다시','요청이 몰렸어요');
    else show('bad','✕ 처리 실패',esc(r.r));
    if(r.r==='ok') stat();
  }catch(e){ BUSY=false; show('dup','연결 끊김','수동 검색 체크로 기록하세요') }
}
async function stat(){ try{ const r=await api({action:'stat'}); if(r.r==='ok') $('cnt').innerHTML=r.checked+' <small>/ '+r.total+' 출석 · '+esc(r.now)+'</small>'; else if(r.r==='nosession') lock('세션이 끝났거나 끊겼습니다.') }catch(e){} }
let CAM={st:null,raf:0};
function stopCam(){ if(CAM.raf)cancelAnimationFrame(CAM.raf); CAM.raf=0; if(CAM.st){CAM.st.getTracks().forEach(t=>t.stop());CAM.st=null} const b=$('cb'); if(b)b.textContent='카메라 켜기'; const p=$('ph'); if(p)p.style.display='' }
async function toggleCam(){ if(CAM.st) return stopCam();
  if(typeof jsQR!=='function'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $('note').textContent='카메라를 쓸 수 없어요 → 「사진으로 스캔」'; return }
  try{ CAM.st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}) }catch(e){ $('note').textContent='카메라를 열 수 없어요('+(e&&e.name||'')+') → 브라우저 카메라 권한 허용 또는 「사진으로 스캔」'; return }
  const v=$('v'); v.srcObject=CAM.st; v.setAttribute('playsinline',''); v.muted=true; try{await v.play()}catch(e){}
  $('ph').style.display='none'; $('cb').textContent='카메라 끄기';
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  const loop=()=>{ if(!CAM.st) return; if(v.readyState>=2&&v.videoWidth){ const w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth); c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
    const q=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'}); if(q&&q.data) handle(q.data) } CAM.raf=requestAnimationFrame(loop) }; loop() }
async function photo(inp){ const f=inp.files&&inp.files[0]; if(!f||typeof jsQR!=='function') return; const url=URL.createObjectURL(f);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url}).catch(()=>null); URL.revokeObjectURL(url); inp.value='';
  if(!img){ show('bad','✕ 사진 오류','다시 찍어 주세요'); return }
  for(const mx of [1600,1000,700]){ const sc=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    const q=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'}); if(q&&q.data){ LAST={t:'',at:0}; return handle(q.data) } }
  show('bad','✕ QR 못 찾음','QR이 크게 나오게 다시 찍어 주세요') }
if(S&&API_RE.test(API)){ stat(); setInterval(stat,30000) }
</script>
</body></html>
